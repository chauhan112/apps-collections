<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Unlock Share</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            #toast {
                transition: all 0.3s ease-in-out;
            }
        </style>
    </head>
    <body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
        <!-- Notification UI -->
        <div
            id="toast"
            class="fixed top-5 left-1/2 -translate-x-1/2 opacity-0 pointer-events-none transform -translate-y-5 z-50"
        >
            <div
                id="toast-bg"
                class="bg-slate-900 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3"
            >
                <span id="toast-icon">🔒</span>
                <span id="toast-message" class="text-sm font-bold"></span>
            </div>
        </div>

        <div
            class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm border border-slate-100 text-center"
        >
            <div class="mb-6">
                <h1
                    class="text-3xl font-black text-slate-900 tracking-tighter italic"
                >
                    Short<span class="text-emerald-600">Share</span>
                </h1>
                <p
                    class="text-slate-400 text-[10px] font-black uppercase mt-2 tracking-widest"
                >
                    Protected Content
                </p>
            </div>

            <div class="space-y-4">
                <input
                    type="text"
                    id="unlock-password"
                    maxlength="5"
                    placeholder="00000"
                    class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-emerald-500 outline-none text-center text-3xl font-mono font-black tracking-[0.5em]"
                />

                <button
                    id="unlock-btn"
                    onclick="unlock('{{ share_id }}')"
                    class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black hover:bg-emerald-700 transition-all"
                >
                    UNLOCK DATA
                </button>

                <div
                    id="unlocked-content"
                    class="mt-4 text-left hidden animate-in fade-in"
                >
                    <div class="p-4 bg-slate-900 rounded-2xl">
                        <pre
                            id="secret-text"
                            class="text-emerald-400 font-mono text-sm overflow-x-auto whitespace-pre-wrap max-h-64"
                        ></pre>
                    </div>
                    <button
                        onclick="copyContent()"
                        class="mt-3 w-full py-2 text-xs font-black text-slate-400 uppercase tracking-widest"
                    >
                        Copy Content
                    </button>
                </div>
            </div>
        </div>

        <script>
            function notify(msg, type = "success") {
                const t = document.getElementById("toast");
                document.getElementById("toast-message").innerText = msg;
                document.getElementById("toast-bg").className =
                    type === "error"
                        ? "bg-red-600 text-white px-6 py-3 rounded-xl shadow-2xl"
                        : "bg-slate-900 text-white px-6 py-3 rounded-xl shadow-2xl";
                t.classList.remove(
                    "opacity-0",
                    "-translate-y-5",
                    "pointer-events-none",
                );
                setTimeout(
                    () =>
                        t.classList.add(
                            "opacity-0",
                            "-translate-y-5",
                            "pointer-events-none",
                        ),
                    2500,
                );
            }

            async function unlock(id) {
                const password =
                    document.getElementById("unlock-password").value;
                const res = await fetch(`/api/unlock/${id}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password }),
                });
                const data = await res.json();
                if (data.content) {
                    document.getElementById("secret-text").innerText =
                        data.content;
                    document
                        .getElementById("unlocked-content")
                        .classList.remove("hidden");
                    document
                        .getElementById("unlock-password")
                        .classList.add("hidden");
                    document
                        .getElementById("unlock-btn")
                        .classList.add("hidden");
                    notify("Decrypted!");
                } else {
                    notify("Incorrect PIN", "error");
                }
            }

            function copyContent() {
                navigator.clipboard.writeText(
                    document.getElementById("secret-text").innerText,
                );
                notify("Copied!");
            }
        </script>
    </body>
</html>
