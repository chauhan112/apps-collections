<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Difference Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4 font-sans text-slate-800">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-6 md:p-8">
        <h1 class="text-2xl font-bold text-center text-slate-900 mb-6">Date Difference Calculator</h1>
        
        <form id="date-form" class="space-y-5">
            <!-- Start Date -->
            <div>
                <label for="start-date" class="block text-sm font-semibold text-slate-700 mb-2">Start Date</label>
                <div class="flex gap-2">
                    <input type="date" id="start-date" required
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition duration-150">
                    <button type="button" onclick="setToday('start-date')"
                        class="px-3 text-sm font-medium text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-lg transition duration-150">
                        Today
                    </button>
                </div>
            </div>

            <!-- End Date -->
            <div>
                <label for="end-date" class="block text-sm font-semibold text-slate-700 mb-2">End Date</label>
                <div class="flex gap-2">
                    <input type="date" id="end-date" required
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition duration-150">
                    <button type="button" onclick="setToday('end-date')"
                        class="px-3 text-sm font-medium text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-lg transition duration-150">
                        Today
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition duration-150">
                Calculate Difference
            </button>
        </form>

        <!-- Result Display -->
        <div id="result-container" class="hidden mt-8 border-t border-slate-100 pt-6 animate-fade-in">
            <h2 class="text-lg font-bold text-slate-900 mb-4">Results</h2>
            
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div class="bg-slate-50 p-4 rounded-xl text-center">
                    <span class="block text-sm text-slate-500 mb-1">Total Days</span>
                    <span id="total-days" class="text-2xl font-extrabold text-indigo-600">-</span>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl text-center">
                    <span class="block text-sm text-slate-500 mb-1">Total Weeks</span>
                    <span id="total-weeks" class="text-2xl font-extrabold text-indigo-600">-</span>
                </div>
            </div>

            <div class="bg-indigo-50/50 border border-indigo-100 p-4 rounded-xl">
                <span class="block text-sm text-indigo-900 font-semibold mb-2">Detailed Breakdown</span>
                <p id="breakdown-text" class="text-slate-700 font-medium leading-relaxed">
                    -
                </p>
            </div>
        </div>
    </div>

    <script>
        // Set inputs to local timezone dates rather than UTC to prevent timezone offset bugs
        function getLocalISODate(date) {
            const offset = date.getTimezoneOffset();
            const localDate = new Date(date.getTime() - (offset * 60 * 1000));
            return localDate.toISOString().split('T')[0];
        }

        // Set date input to current date
        function setToday(inputId) {
            const today = new Date();
            document.getElementById(inputId).value = getLocalISODate(today);
        }

        // Handle the calculation
        document.getElementById('date-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const startVal = document.getElementById('start-date').value;
            const endVal = document.getElementById('end-date').value;

            if (!startVal || !endVal) return;

            // Appending time parameters prevents JS parsing dates in UTC
            let d1 = new Date(startVal + 'T00:00:00');
            let d2 = new Date(endVal + 'T00:00:00');

            // Swap dates if start date is after end date to avoid negative results
            let isSwapped = false;
            if (d1 > d2) {
                const temp = d1;
                d1 = d2;
                d2 = temp;
                isSwapped = true;
            }

            // Total Days calculation
            const diffTime = Math.abs(d2 - d1);
            const totalDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            const totalWeeks = (totalDays / 7).toFixed(1);

            // Detailed Years, Months, and Days breakdown calculation
            let years = d2.getFullYear() - d1.getFullYear();
            let months = d2.getMonth() - d1.getMonth();
            let days = d2.getDate() - d1.getDate();

            if (days < 0) {
                // Get the last day of the previous month
                const prevMonth = new Date(d2.getFullYear(), d2.getMonth(), 0);
                days += prevMonth.getDate();
                months -= 1;
            }

            if (months < 0) {
                months += 12;
                years -= 1;
            }

            // Build dynamic text output
            let breakdownParts = [];
            if (years > 0) breakdownParts.push(`${years} ${years === 1 ? 'year' : 'years'}`);
            if (months > 0) breakdownParts.push(`${months} ${months === 1 ? 'month' : 'months'}`);
            if (days > 0 || breakdownParts.length === 0) {
                breakdownParts.push(`${days} ${days === 1 ? 'day' : 'days'}`);
            }

            let breakdownString = breakdownParts.join(', ');
            if (isSwapped) {
                breakdownString += " (Calculated in reverse because the start date was set after the end date)";
            }

            // Update UI elements
            document.getElementById('total-days').innerText = totalDays.toLocaleString();
            document.getElementById('total-weeks').innerText = totalWeeks;
            document.getElementById('breakdown-text').innerText = breakdownString;

            // Reveal the results container
            document.getElementById('result-container').classList.remove('hidden');
        });
    </script>
</body>
</html>
