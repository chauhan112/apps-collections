name: apps-stack

# apps-collections is the MAIN app and the ONLY service published to the host.
# Both Django backends are internal: no host ports, reachable over the shared
# compose network by service name (e.g. http://backend:8500).
#
#   apps (Flask gateway, this repo)  ->  host ${APPS_PORT:-8003}
#     proxies /backend/*  ->  http://backend:${BACKEND_PORT:-8500}   (internal)
#     may also reach         http://generic-backend:8000             (internal)
#
# Private repos are cloned on the host into ./services/<repo> (run ./clone.sh).

services:
  apps:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.apps
      args:
        APP_DIR: "."
        PYTHON_VERSION: "3.14"
    image: apps-collection:latest
    container_name: apps-collection
    environment:
      # The only public entry point. Adjust BASE_URL to your real public URL.
      BASE_URL: ${BASE_URL:-http://localhost:8003/apps}
      # Reverse-proxy target for /backend/* -> the internal `backend` service.
      # Point this at http://generic-backend:8000 instead if /backend/* should
      # route to generic-backend.
      BACKEND_TARGET: ${BACKEND_TARGET:-http://backend:8500}
    ports:
      - "${APPS_PORT:-8003}:${APPS_PORT:-8003}"
    command:
      - gunicorn
      - --bind
      - "0.0.0.0:${APPS_PORT:-8003}"
      - --workers
      - "1"
      - --threads
      - "4"
      - app:app
    depends_on:
      backend: { condition: service_healthy }
      generic-backend: { condition: service_healthy }
    restart: unless-stopped

  generic-backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DIR: services/generic-backend
        PYTHON_VERSION: "3.13"
    image: apps-generic-backend:latest
    container_name: generic-backend
    env_file:
      - env/generic-backend.env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
    expose:
      - "8000"
    # No host port -> internal only (reachable as http://generic-backend:8000).
    # Separate SQLite file on the host (NOT shared with `backend`).
    volumes:
      - ./data/generic-backend.sqlite3:/app/db.sqlite3
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 25s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DIR: services/backend
        PYTHON_VERSION: "3.14"
    image: apps-backend:latest
    container_name: backend
    env_file:
      - env/backend.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    expose:
      - "${BACKEND_PORT:-8500}"
    # No host port -> internal only (reachable as http://backend:<BACKEND_PORT>).
    # Separate SQLite file on the host (NOT shared with `generic-backend`).
    volumes:
      - ./data/backend.sqlite3:/app/db.sqlite3
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - "0.0.0.0:${BACKEND_PORT:-8500}"
      - --workers
      - "3"
      - --worker-class
      - gthread
      - --threads
      - "8"
      - --timeout
      - "600"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket, os; socket.create_connection(('127.0.0.1', int(os.environ.get('BACKEND_PORT', '8500'))), timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
